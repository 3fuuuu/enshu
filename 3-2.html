<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>お試し canvas 2</title>
    <style type="text/css">
      canvas {
        border: 2px solid black;
      }
    </style>

    <script type="text/javascript">
      function gdraw() {
        var cx = document.getElementById("cv");
        if (cx.getContext) {
          var cxg = cx.getContext("2d");
          cxg.beginPath();
          cxg.moveTo(100, 200);
          cxg.lineTo(200, 100);
          cxg.lineTo(300, 200);
          cxg.lineTo(200, 300);
          cxg.closePath();
          cxg.stroke();
        }
      }
      function gclear() {
        var cx = document.getElementById("cv");
        if (cx.getContext) {
          var cxg = cx.getContext("2d");
          cxg.fillStyle = "rgb(255,255,255)";
          cxg.fillRect(0, 0, 400, 400);
        }
      }
    </script>
  </head>

  <body>
    <canvas id="cv" width="400" height="400"></canvas><br />
    <input type="button" onclick="gdraw()" value="四角" />
    <input type="button" onclick="gclear()" value="消去" />
  </body>
</html>
