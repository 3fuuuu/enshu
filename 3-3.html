<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>モンテカルロ法</title>
    <style type="text/css">
      canvas {
        border: 2px solid black;
      }
    </style>

    <script type="text/javascript">
      function mdraw() {
        var cx = document.getElementById("cv");
        if (cx.getContext) {
          var cxg = cx.getContext("2d");
          cxg.fillStyle = "rgb(255,255,266)";
          cxg.fillRect = "(0,0,400,400)";
          cxg.beginPath();
          cxg.strokeStyle = "rgb(0,0,0)";
          cxg.arc(0, 0, 399, 0, Math.PI / 2, false);
          cxg.stroke();

          var times = parseInt(document.frm.times.value);
          var n, n1;
          n = 0;
          n1 = 0;

          for (i = 0; i < times; i++) {
            min = 0;
            max = 399;

            x = Math.floor(Math.random() * (max + 1 - min) + min);
            y = Math.floor(Math.random() * (max + 1 - min) + min);
            n++;

            if (x * x + y * y <= 400 * 400) {
              cxg.beginPath();
              cxg.fillStyle = "blue";
              cxg.arc(x, y, 3, 0, Math.PI * 2, false);
              cxg.fill();
              n1++;
            } else {
              cxg.beginPath();
              cxg.fillStyle = "red";
              cxg.arc(x, y, 3, 0, Math.PI * 2, false);
              cxg.fill();
            }
          }
          document.frm.result.value = (4 * n1) / n;
        }
      }
    </script>
  </head>

  <body>
    <canvas id="cv" width="400" height="400"></canvas><br />
    <form name="frm">
      計算回数
      <input type="text" value="1000" name="times" />
      <input type="button" onclick="mdraw()" value="計算" name="start" /><br />
      計算結果
      <input type="text" name="result" />
    </form>
  </body>
</html>
